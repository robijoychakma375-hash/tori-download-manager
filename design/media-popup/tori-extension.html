<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const P={dl:'M12 4v10M8 10l4 4 4-4M5 19h14',cp:'M9 9h10v11H9zM5 15V4h10',set:'M4 7h10M18 7h2M4 17h2M10 17h10M16 7a2 2 0 100 .01M8 17a2 2 0 100 .01',op:'M14 4h6v6M20 4l-9 9M18 14v6H4V6h6',ck:'M5 12l5 5 9-10',fd:'M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z'};
