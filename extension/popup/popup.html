<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>TORI Download Manager</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="xp" id="main">
    <!-- Header (.xh) -->
    <header class="xh">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M12 4v10M8 10l4 4 4-4M5 19h14"/>
        </svg>
      </span>
      <div class="xt">
        <h1>TORI Download Manager</h1>
        <button type="button" class="st conn" id="statusPill" title="Desktop connection status">
          <i id="statusDot" aria-hidden="true"></i>
          <span id="stTxt" role="status" aria-live="polite">Connecting…</span>
        </button>
      </div>
    </header>

    <div class="hr"></div>

    <!-- Capture Toggle Row (.cp) -->
    <div class="cp">
      <div class="t">
        <b>Capture downloads</b>
        <span>Send browser downloads to TORI</span>
      </div>
      <label class="swl" for="capSwMain" title="Toggle automatic download interception">
        <input type="checkbox" id="capSwMain" switch checked aria-label="Capture downloads">
        <span class="sw-track"><span class="sw-knob"></span></span>
      </label>
    </div>

    <!-- Live Offline / Pairing Action Banner (only shown when disconnected/unavailable) -->
    <div class="stale-bar" id="connBanner" hidden>
      <div class="stale-txt" id="connBannerTxt"></div>
      <button type="button" class="btn mb" id="btnReconnect">Reconnect</button>
    </div>

    <!-- Active Tab Media Summary (hidden when empty — zero fake placeholders) -->
    <section class="media-wrap" id="mediaSection" hidden aria-label="Detected media on current tab">
      <div class="sec">
        <span id="mediaCountHeader">Media on this page</span>
        <button type="button" class="lnk" id="btnRefreshMedia">Refresh</button>
      </div>
      <div class="list" id="mediaList"></div>
    </section>

    <!-- Action Notice Feedback -->
    <div class="notice-bar" id="popupNotice" role="status" aria-live="polite" hidden></div>

    <!-- Footer Actions (.xf) matching tori-extension.html -->
    <footer class="xf">
      <button type="button" class="btn def f" id="open">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/>
        </svg>
        <span id="openLabel">Open Tori</span>
      </button>
      <button type="button" class="btn sq" id="gear" aria-label="Extension settings" title="Extension Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>
        </svg>
      </button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
