<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tori Download Manager</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="xp on" id="popupRoot">
    <!-- Header -->
    <div class="xh">
      <span class="logo">
        <svg viewBox="0 0 24 24"><path d="M12 4v10M8 10l4 4 4-4M5 19h14"/></svg>
      </span>
      <div>
        <b>Tori</b>
        <div class="st wait" id="statusPill">
          <i id="statusDot"></i>
          <span id="statusText">Connecting…</span>
        </div>
      </div>
    </div>

    <!-- Capture Downloads Toggle -->
    <div class="card">
      <div class="row">
        <div class="t">
          <b>Capture downloads</b>
          <span class="s">Send browser downloads to Tori</span>
        </div>
        <label class="swl">
          <input type="checkbox" id="captureToggle" checked>
          <span class="sw-track"><span class="sw-knob"></span></span>
        </label>
      </div>
    </div>

    <!-- Media on this page -->
    <div class="xs" id="mediaCountHeader">Media on this page · 0</div>
    <div class="card" id="mediaList">
      <div class="empty-state">No media detected on current page</div>
    </div>

    <!-- Recent Downloads from Engine -->
    <div class="xs" id="recentHeader">Recent Downloads</div>
    <div class="card" id="recentList">
      <div class="empty-state">No recent downloads</div>
    </div>

    <!-- Footer Actions -->
    <div class="xf">
      <button class="btn f def" id="openToriBtn" title="Focus or launch desktop app">
        <svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/></svg>
        Open Tori
      </button>
      <button class="btn sq" id="optionsBtn" title="Extension Options">
        <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M16 7a2 2 0 100 .01M8 17a2 2 0 100 .01"/></svg>
      </button>
    </div>
  </div>

  <div id="toast"></div>

  <script src="popup.js"></script>
</body>
</html>
