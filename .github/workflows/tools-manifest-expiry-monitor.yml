name: External Tools Manifest Expiry Monitor (Read-Only UTC)

on:
  schedule:
    # Daily at 06:00 UTC (read-only monitoring; NEVER holds signing keys or auto-publishes)
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      strict_exit:
        description: "Fail workflow on CRITICAL/EXPIRED/SECURITY incidents"
        required: false
        type: boolean
        default: true

# Least-privilege permissions: strictly read-only repository access; zero signing credentials
permissions:
  contents: read

concurrency:
  group: tori-tools-manifest-expiry-monitor
  cancel-in-progress: false

jobs:
  monitor-expiry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository (SHA-pinned, read-only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js (SHA-pinned)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Run UTC External Tools Manifest Expiry & Integrity Check
        id: expiry_check
        env:
          TORI_EVENT_NAME: ${{ github.event_name }}
          TORI_STRICT_EXIT: ${{ inputs.strict_exit }}
        run: |
          STRICT_FLAG="--strict-exit"
          if [ "$TORI_EVENT_NAME" = "workflow_dispatch" ] && [ "$TORI_STRICT_EXIT" = "false" ]; then
            STRICT_FLAG=""
          fi
          node scripts/monitor_tools_manifest_expiry.js \
            --force \
            --report-file target/tools_renewal_state/ci_expiry_report.json \
            $STRICT_FLAG

      - name: Upload auditable expiry monitoring report (SHA-pinned)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tools-manifest-expiry-monitor-report
          path: target/tools_renewal_state/ci_expiry_report.json
          if-no-files-found: warn
          retention-days: 30
