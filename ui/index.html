<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tori Download Manager</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #232326;
        color: #f2f2f4;
        user-select: none;
        -webkit-user-select: none;
      }
      html[data-theme="light"], html[data-theme="light"] body {
        background-color: #f5f5f8;
        color: #1d1d1f;
      }
      #root {
        width: 100%;
        height: 100%;
      }
    </style>
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('tori_settings_v2');
          var theme = 'system';
          var accent = 'indigo';
          if (raw) {
            var s = JSON.parse(raw);
            if (s && s.theme) theme = s.theme;
            if (s && s.accent) accent = s.accent;
          }
          try {
            var q = new URLSearchParams(window.location.search);
            var qt = q.get('theme');
            var qa = q.get('accent');
            if (qt && (qt === 'light' || qt === 'dark' || qt === 'system')) theme = qt;
            if (qa && (qa === 'indigo' || qa === 'ocean' || qa === 'emerald' || qa === 'rose')) accent = qa;
          } catch (_e) {}
          var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var effectiveTheme = isDark ? 'dark' : 'light';
          document.documentElement.dataset.theme = effectiveTheme;
          document.documentElement.dataset.accent = accent;
          var bg = isDark ? '#232326' : '#f5f5f8';
          document.documentElement.style.backgroundColor = bg;
          if (document.body) document.body.style.backgroundColor = bg;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
          document.documentElement.dataset.accent = 'indigo';
          document.documentElement.style.backgroundColor = '#232326';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
